# Ports `redundant-bool-ternary` from the SlopCodeBench rule pack.
# Ternary patterns must be quoted: an unquoted `a : b` is a YAML mapping.
id: redundant-bool-ternary
language: swift
severity: warning
message: Ternary returning boolean literals — the condition already is the value
metadata:
  category: slop
  upstream: redundant-bool-ternary
rule:
  any:
    - pattern: "$C ? true : false"
    - pattern: "$C ? false : true"
