# Ports `manual-min-max` from the SlopCodeBench rule pack.
id: manual-min-max
language: typescript
severity: warning
message: Hand-rolled min/max — use Math.max / Math.min
metadata:
  category: slop
  upstream: manual-min-max
rule:
  any:
    - pattern: "$A > $B ? $A : $B"
    - pattern: "$A < $B ? $A : $B"
    - pattern: "$A >= $B ? $A : $B"
    - pattern: "$A <= $B ? $A : $B"
